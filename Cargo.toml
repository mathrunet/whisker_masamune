# whisker_masamune: native modules and app foundations for Whisker (https://whisker.rs) apps.
[workspace]
members = ["packages/*"]
# The whisker-router fix is consumed by apps through `[patch.crates-io]` (see patches/whisker-router/PATCHES.md).
exclude = ["patches/whisker-router"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mathrunet/whisker_masamune"
homepage = "https://github.com/mathrunet/whisker_masamune"
authors = ["mathru (https://mathru.net)"]

[workspace.dependencies]
whisker = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-channel = "0.3"
futures-util = "0.3"
futures-executor = "0.3"
libsql = { version = "0.9", default-features = false, features = ["core"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
whisker-paths = "0.14"
whisker-firebase = { version = "0.1", default-features = false }
wiremock = "0.6"
whisker-local-store = "0.14"
whisker-status-bar = "0.14"
whisker-router = "0.14"
whisker-icons = "0.14"
whisker-svg = "0.14"
whisker-safe-area = "0.14"
whisker-keyboard = "0.14"
tempfile = "3"
masamune-whisker-bridge = { path = "packages/masamune-whisker-bridge", version = "0.1.0" }
masamune-whisker-firebase-app-check = { path = "packages/masamune-whisker-firebase-app-check", version = "0.1.0" }
masamune-whisker-workers = { path = "packages/masamune-whisker-workers", version = "0.1.0" }
masamune-whisker-model = { path = "packages/masamune-whisker-model", version = "0.1.0" }
masamune-whisker-appearance = { path = "packages/masamune-whisker-appearance", version = "0.1.0" }
masamune-whisker-ui = { path = "packages/masamune-whisker-ui", version = "0.1.0" }
masamune-whisker-boot = { path = "packages/masamune-whisker-boot", version = "0.1.0" }
masamune-whisker-device-info = { path = "packages/masamune-whisker-device-info", version = "0.1.0" }
masamune-whisker-app-control = { path = "packages/masamune-whisker-app-control", version = "0.1.0" }

# The workspace builds and tests against the patched router, like the apps that use it.
[patch.crates-io]
whisker-router = { path = "patches/whisker-router" }
