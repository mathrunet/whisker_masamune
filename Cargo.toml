# whisker_masamune: native modules and app foundations for Whisker (https://whisker.rs) apps.
[workspace]
members = ["packages/*"]
# Apps and this workspace use whisker-router from the mathrunet/whisker fork main.
# Rust Host crates are built by whisker-cng inside the generated platform projects.
exclude = ["packages/masamune-whisker-localize/web"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/mathrunet/whisker_masamune"
homepage = "https://github.com/mathrunet/whisker_masamune"
authors = ["mathru (https://mathru.net)"]

[workspace.dependencies]
masamune-whisker-functions = { path = "packages/masamune-whisker-functions", version = "0.2.1" }
masamune-whisker-logger = { path = "packages/masamune-whisker-logger", version = "0.2.1" }
masamune-whisker-logger-firebase = { path = "packages/masamune-whisker-logger-firebase", version = "0.2.1" }
whisker-image = "0.14"
whisker = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-channel = "0.3"
futures-util = "0.3"
futures-executor = "0.3"
libsql = { version = "0.9", default-features = false, features = ["core"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
whisker-paths = "0.14"
whisker-plugin = "0.16"
anyhow = "1"
whisker-firebase = { version = "0.1", default-features = false }
wiremock = "0.6"
whisker-local-store = "0.14"
whisker-status-bar = "0.14"
whisker-router = "0.14"
whisker-icons = "0.14"
whisker-svg = "0.14"
whisker-safe-area = "0.14"
whisker-keyboard = "0.14"
tempfile = "3"
serde_yaml = "0.9"
base64 = "0.22"
masamune-whisker-bridge = { path = "packages/masamune-whisker-bridge", version = "0.2.1" }
masamune-whisker-firebase-app-check = { path = "packages/masamune-whisker-firebase-app-check", version = "0.2.1" }
masamune-whisker-workers = { path = "packages/masamune-whisker-workers", version = "0.2.1" }
masamune-whisker-model = { path = "packages/masamune-whisker-model", version = "0.2.1" }
masamune-whisker-appearance = { path = "packages/masamune-whisker-appearance", version = "0.2.1" }
masamune-whisker-ui = { path = "packages/masamune-whisker-ui", version = "0.2.1" }
masamune-whisker-boot = { path = "packages/masamune-whisker-boot", version = "0.2.1" }
masamune-whisker-adapter = { path = "packages/masamune-whisker-adapter", version = "0.2.1" }
masamune-whisker-screen = { path = "packages/masamune-whisker-screen", version = "0.2.1" }
masamune-whisker-localize = { path = "packages/masamune-whisker-localize", version = "0.2.1" }
masamune-whisker-turso = { path = "packages/masamune-whisker-turso", version = "0.2.1" }
masamune-whisker-tidb = { path = "packages/masamune-whisker-tidb", version = "0.2.1" }
masamune-whisker-firestore = { path = "packages/masamune-whisker-firestore", version = "0.2.1" }
masamune-whisker-firebase-firestore-db = { path = "packages/masamune-whisker-firebase-firestore-db", version = "0.2.1" }
masamune-whisker-device-info = { path = "packages/masamune-whisker-device-info", version = "0.2.1" }
masamune-whisker-app-control = { path = "packages/masamune-whisker-app-control", version = "0.2.1" }
masamune-whisker-storage = { path = "packages/masamune-whisker-storage", version = "0.2.1" }
masamune-whisker-view-capture = { path = "packages/masamune-whisker-view-capture", version = "0.2.1" }
masamune-whisker-billing = { path = "packages/masamune-whisker-billing", version = "0.2.1" }
masamune-whisker-image-picker = { path = "packages/masamune-whisker-image-picker", version = "0.2.1" }
masamune-whisker-ai-debugger = { path = "packages/masamune-whisker-ai-debugger", version = "0.2.1" }
whisker-input = "0.14"
regex = "1"

# Every whisker crate comes from the mathrunet/whisker fork main (checked by
# `scripts/whisker-fork.sh check`). Keep the source string identical on every line.
[patch.crates-io]
whisker-image = { git = "https://github.com/mathrunet/whisker", branch = "main" }
whisker-input = { git = "https://github.com/mathrunet/whisker", branch = "main" }
