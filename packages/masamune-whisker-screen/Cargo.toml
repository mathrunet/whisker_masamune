[package]
name = "masamune-whisker-screen"
description = "Screen size and orientation signals, orientation lock and Android configChanges for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "bin/**"]

[lib]
crate-type = ["rlib"]

# CNG plugin: `app.project_plugin::<MasamuneScreen>(|c| …)` in whisker.rs sets the main activity's
# configChanges (and orientation) on Android and the supported orientations on iOS.
[package.metadata.whisker.plugins.masamune-whisker-screen]
bin = "masamune-whisker-screen-plugin"
protocol = "project"

[[bin]]
name = "masamune-whisker-screen-plugin"
path = "bin/masamune_whisker_screen_plugin.rs"
test = false
bench = false

[dependencies]
whisker.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
serde.workspace = true
masamune-whisker-device-info.workspace = true
masamune-whisker-app-control.workspace = true
