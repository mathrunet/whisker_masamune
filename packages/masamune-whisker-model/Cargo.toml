[package]
name = "masamune-whisker-model"
description = "Shared model layer for Whisker apps: query types, REST database client and an on-device libsql cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
futures-channel.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
masamune-whisker-workers.workspace = true
masamune-whisker-logger.workspace = true
log.workspace = true
whisker-paths.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsql.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
