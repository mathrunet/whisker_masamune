[package]
name = "masamune-whisker-functions"
description = "Typed actions and adapters for JSON APIs in Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**"]

[dependencies]
masamune-whisker-auth.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
log.workspace = true


# Apple platforms use the OS TLS stack (Security.framework) so apps ship no non-OS encryption.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
