[package]
name = "masamune-whisker-storage-cloudflare"
description = "Cloudflare R2 through the Masamune storage worker as a masamune-whisker-storage adapter for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**"]

[lib]
crate-type = ["rlib"]

[dependencies]
base64.workspace = true
serde_json.workspace = true
masamune-whisker-storage.workspace = true
masamune-whisker-workers.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile.workspace = true
wiremock.workspace = true
