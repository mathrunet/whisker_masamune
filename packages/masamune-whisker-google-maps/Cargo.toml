[package]
name = "masamune-whisker-google-maps"
description = "Google Maps view element with markers, polylines and camera control for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**", "bin/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[package.metadata.whisker.plugins.masamune-whisker-google-maps]
bin = "masamune-whisker-google-maps-plugin"
protocol = "project"

[[bin]]
name = "masamune-whisker-google-maps-plugin"
path = "bin/masamune_whisker_google_maps_plugin.rs"
test = false
bench = false

[dependencies]
whisker.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
