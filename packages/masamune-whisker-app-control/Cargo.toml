[package]
name = "masamune-whisker-app-control"
description = "Open URLs in external apps and close the app for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**", "bin/**"]

[lib]
crate-type = ["rlib"]

# CNG plugin: `app.plugin::<MasamuneAppControl>(|c| …)` in whisker.rs declares the URL schemes
# `open_url` may query on iOS (`LSApplicationQueriesSchemes`).
[package.metadata.whisker.plugins.masamune-whisker-app-control]
bin = "masamune-whisker-app-control-plugin"

[[bin]]
name = "masamune-whisker-app-control-plugin"
path = "bin/masamune_whisker_app_control_plugin.rs"
test = false
bench = false

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[dependencies]
whisker.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
