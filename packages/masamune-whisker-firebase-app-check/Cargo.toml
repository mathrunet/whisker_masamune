[package]
name = "masamune-whisker-firebase-app-check"
description = "Firebase App Check activation and token retrieval for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "bin/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

# CNG plugin: `app.project_plugin::<MasamuneFirebaseAppCheck>(|c| …)` in whisker.rs adds the
# App Attest entitlement on iOS (no-op on Android).
[package.metadata.whisker.plugins.masamune-whisker-firebase-app-check]
bin = "masamune-whisker-firebase-app-check-plugin"
protocol = "project"

[[bin]]
name = "masamune-whisker-firebase-app-check-plugin"
path = "bin/masamune_whisker_firebase_app_check_plugin.rs"
test = false
bench = false

[dependencies]
whisker.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
