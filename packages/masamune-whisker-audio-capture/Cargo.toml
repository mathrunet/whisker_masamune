[package]
name = "masamune-whisker-audio-capture"
description = "Microphone capture as 16 kHz mono PCM16 chunks for Whisker apps (iOS, Android and Web)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**", "web/**"]

[lib]
crate-type = ["rlib"]

# Function-only native module. It has no CNG plugin: the app declares the microphone permission
# (iOS `NSMicrophoneUsageDescription`, Android `RECORD_AUDIO`) itself, for example with the
# `masamune-whisker-ai-debugger` plugin.
[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }
web = { manifest = "web/Cargo.toml" }

[dependencies]
whisker.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
