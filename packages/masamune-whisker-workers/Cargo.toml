[package]
name = "masamune-whisker-workers"
description = "HTTP client for Masamune Cloudflare Workers and Firebase callable functions in Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# Firebase ID tokens from whisker-firebase Auth (`AuthProvider::firebase`).
firebase-auth = ["dep:whisker-firebase", "whisker-firebase/auth"]
# Firebase callable functions with App Check (`Callable`).
firebase-functions = ["firebase-auth", "dep:masamune-whisker-firebase-app-check"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
log.workspace = true
whisker-firebase = { workspace = true, optional = true }
masamune-whisker-firebase-app-check = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
