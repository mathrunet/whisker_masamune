[package]
name = "masamune-whisker-storage-functions"
description = "Storage adapter that reads and writes files through the Masamune storage Functions callable for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**"]

[lib]
crate-type = ["rlib"]

[dependencies]
masamune-whisker-functions.workspace = true
masamune-whisker-storage.workspace = true
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile.workspace = true
