[package]
name = "masamune-whisker-functions-firebase"
description = "Firebase callable adapter for Whisker Functions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**"]

[features]
default = []
# Firebase Auth ID tokens and native App Check (`with_firebase_providers`).
firebase = [
    "dep:masamune-whisker-auth-firebase",
    "dep:masamune-whisker-firebase-app-check",
]

[dependencies]
masamune-whisker-functions.workspace = true
masamune-whisker-auth-firebase = { workspace = true, optional = true }
masamune-whisker-firebase-app-check = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
