[package]
name = "masamune-whisker-audio-session"
description = "Audio session, Now Playing, remote commands and background playback for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**", "bin/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[package.metadata.whisker.plugins.masamune-whisker-audio-session]
bin = "masamune-whisker-audio-session-plugin"
protocol = "project"

[[bin]]
name = "masamune-whisker-audio-session-plugin"
path = "bin/masamune_whisker_audio_session_plugin.rs"
test = false
bench = false

[dependencies]
whisker.workspace = true
masamune-whisker-adapter.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
