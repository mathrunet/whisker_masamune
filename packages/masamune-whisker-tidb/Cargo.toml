[package]
name = "masamune-whisker-tidb"
description = "TiDB databases through the Masamune Cloudflare worker, with an on-device libsql cache, for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde_json.workspace = true
log.workspace = true
masamune-whisker-workers.workspace = true
masamune-whisker-model.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
