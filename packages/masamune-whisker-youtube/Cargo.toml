[package]
name = "masamune-whisker-youtube"
description = "Native YouTube player element (YouTube IFrame Player API inside WKWebView / android.webkit.WebView) for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "README.md", "src/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[dependencies]
whisker.workspace = true
serde.workspace = true
tokio.workspace = true
