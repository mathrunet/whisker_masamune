[package]
name = "masamune-whisker-google-sign-in"
description = "Google Sign-In (Firebase Auth google.com provider) for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "bin/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

# CNG plugin: `app.project_plugin::<MasamuneGoogleSignIn>(|c| …)` in whisker.rs registers the
# REVERSED_CLIENT_ID URL scheme on iOS (no-op on Android).
[package.metadata.whisker.plugins.masamune-whisker-google-sign-in]
bin = "masamune-whisker-google-sign-in-plugin"
protocol = "project"

[[bin]]
name = "masamune-whisker-google-sign-in-plugin"
path = "bin/masamune_whisker_google_sign_in_plugin.rs"
test = false
bench = false

[dependencies]
whisker.workspace = true
masamune-whisker-adapter.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
