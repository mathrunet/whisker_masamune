[package]
name = "masamune-whisker-admob"
description = "Google AdMob adaptive banners and full-screen ads for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "bin/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

# CNG plugin: `app.plugin::<MasamuneAdmob>(|c| …)` in whisker.rs writes the iOS Info.plist keys
# (GADApplicationIdentifier, SKAdNetworkItems, NSUserTrackingUsageDescription). No-op on Android.
[package.metadata.whisker.plugins.masamune-whisker-admob]
bin = "masamune-whisker-admob-plugin"

[[bin]]
name = "masamune-whisker-admob-plugin"
path = "bin/masamune_whisker_admob_plugin.rs"
test = false
bench = false

[dependencies]
whisker.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
