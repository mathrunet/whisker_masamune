[package]
name = "masamune-whisker-image-picker"
description = "Pick images from the gallery or camera and save resized copies for Whisker apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "android/**", "build.gradle.kts", "Package.swift", "ios/**", "bin/**"]

[lib]
crate-type = ["rlib"]

# CNG plugin: `app.plugin::<MasamuneImagePicker>(|c| …)` in whisker.rs writes the iOS camera and
# photo library usage descriptions.
[package.metadata.whisker.plugins.masamune-whisker-image-picker]
bin = "masamune-whisker-image-picker-plugin"

[[bin]]
name = "masamune-whisker-image-picker-plugin"
path = "bin/masamune_whisker_image_picker_plugin.rs"
test = false
bench = false

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[dependencies]
whisker.workspace = true
masamune-whisker-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
whisker-plugin.workspace = true
anyhow.workspace = true
